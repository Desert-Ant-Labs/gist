# Build/test entry points for gist. Focus for the beta is the Node/web package:
#
#   mise run build-web   # WebAssembly Swift core -> packages/gist-node/dist
#   mise run test-web     # the npm suite for packages/gist-node
#   mise run test-swift   # the SwiftPM pipeline suite (tokenizer + streams parity)
#
# The wasm SDK auto-installs on first run (matched to the pinned toolchain).
# Apple (Core ML) / Android (LiteRT) targets are deferred.

[tools]
swift = "6.3.3"

[tasks.test-swift]
description = "SwiftPM test suite (tokenizer + semantic/lexical stream parity)"
dir = "{{ config_root }}"
run = "swift test"

[tasks.build-web]
description = "Build the WebAssembly core into packages/gist-node/dist"
dir = "{{ config_root }}"
shell = "bash -c"
tools = { "aqua:WebAssembly/binaryen" = "130" }  # wasm-opt
run = """
set -euo pipefail
OUT=.build/wasm-package
DIST=packages/gist-node/dist

SWIFT_VER=$(swift --version 2>/dev/null | awk '{for(i=1;i<=NF;i++) if($i ~ /^[0-9]/){print $i; exit}}')
[ -n "$SWIFT_VER" ] || { echo "error: could not determine the Swift version" >&2; exit 1; }
SDK=${WASM_SDK:-swift-$SWIFT_VER-RELEASE_wasm}

have_bundle() { for d in "$HOME/.swiftpm/swift-sdks" "$HOME/Library/org.swift.swiftpm/swift-sdks"; do [ -d "$d/$1" ] && return 0; done; return 1; }
if ! have_bundle "$SDK.artifactbundle"; then
    echo "Installing the Swift WebAssembly SDK $SWIFT_VER (one-time)..."
    tmp=$(mktemp -d)
    curl -fSL -o "$tmp/sdk.tar.gz" "https://download.swift.org/swift-$SWIFT_VER-release/wasm-sdk/swift-$SWIFT_VER-RELEASE/$SDK.artifactbundle.tar.gz"
    swift sdk install "$tmp/sdk.tar.gz"
    rm -rf "$tmp"
fi

swift package -Xswiftc -Osize --swift-sdk "$SDK" --allow-writing-to-package-directory js --product GistWeb -c release --output "$OUT"

if command -v wasm-opt >/dev/null; then
    wasm-opt -Oz --enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-reference-types --strip-debug --strip-producers "$OUT/GistWeb.wasm" -o "$OUT/GistWeb.wasm"
else
    echo "warning: wasm-opt not found; shipping unoptimized wasm (~3x larger)" >&2
fi

rm -rf "$DIST"
mkdir -p "$DIST"
cp "$OUT"/GistWeb.wasm "$OUT"/index.js "$OUT"/index.d.ts "$OUT"/instantiate.js "$OUT"/instantiate.d.ts "$OUT"/runtime.js "$OUT"/runtime.d.ts "$DIST/"
cp -r "$OUT"/platforms "$DIST/platforms"
cp LICENSE.md packages/gist-node/LICENSE.md 2>/dev/null || true

ls -la "$DIST/GistWeb.wasm"
echo "done: packages/gist-node is ready"
"""

[tasks.test-web]
description = "npm test suite for packages/gist-node (needs @litertjs/core)"
dir = "{{ config_root }}/packages/gist-node"
depends = ["build-web"]
tools = { node = "22" }
run = "npm test"
