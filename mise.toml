# Build/test/publish for gist. The shared build/publish/version logic lives in
# desert-ant-core's model-SDK catalog (sdk-build/model-sdk.toml, pinned below);
# this file supplies gist's config and its model-specific test tasks. See the
# catalog README for the full task list and the mise.local.toml secret setup.
[tools]
swift = "6.3.3"

[vars]
model = "gist"
product = "Gist"
# Staged into the AAR/Node resources. gist ships a head artifact plus the shared
# sidecars the pure-Swift pipeline reads (embedding, tokenizer, config, taxonomy).
tflite_files = "gist.tflite gist_config.json gist_embedding.i8 gist_embedding.json gist_tokenizer.bin taxonomy.json"

[env]
DAL_GPU = ""

[task_config]
includes = ["git::https://github.com/Desert-Ant-Labs/desert-ant-core.git//sdk-build/model-sdk.toml?ref=v0.5.5"]

# Test harnesses are model-specific, so they stay local (test-swift and
# test-android come from the catalog).
[tasks.test]
description = "Run every test suite (swift + node + web + android)"
depends = ["test-swift", "test-node", "test-web", "test-android"]

[tasks.test-node]
description = "Server-side Node test suite for packages/gist-node (native core via the gist_* C ABI)"
dir = "{{ config_root }}/packages/gist-node"
depends = ["node-natives"]
tools = { node = "22" }
run = """
set -euo pipefail
npm install --no-save --no-package-lock koffi@^2.9.0 >/dev/null 2>&1 || npm install >/dev/null 2>&1 || true
node --test test/gist.test.mjs
"""

[tasks.test-web]
description = "Headless-Chromium browser E2E for packages/gist-node (WebAssembly + LiteRT.js)"
dir = "{{ config_root }}/Examples/GistWasmExample"
depends = ["build-web"]
tools = { node = "22" }
run = "npm install && npm run browser-example"
